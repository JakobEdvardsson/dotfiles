onboarding = false

[theme]
name = "solarized-light"

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+t"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
previous_workspace = "alt+up"
next_workspace = "alt+down"
last_pane = "prefix+;"
previous_agent = ["alt+k", "alt+i"]
next_agent = ["alt+j", "alt+e"]
open_worktree = "prefix+t"
close_workspace = "prefix+shift+d"
resize_mode = "prefix+shift+r"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle pane"

# vim-herdr-navigation: ctrl+arrows move between herdr panes and Neovim splits
[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"
