id = "local.neo4j-worktree"
name = "neo4j-cloud worktree"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Seed new neo4j-cloud worktrees with local state"
platforms = ["linux", "macos"]

# Runs for every worktree created through Herdr. bootstrap.sh filters to
# neo4j-cloud checkouts and seeds them from the main checkout. It does not
# create tabs or start editors/agents.
[[events]]
on = "worktree.created"
command = ["sh", "bootstrap.sh"]

# Re-run the seed by hand for the focused workspace's worktree.
[[actions]]
id = "seed"
title = "Re-seed local files"
description = "Copy ignored/untracked local state into this worktree"
contexts = ["workspace"]
command = ["sh", "bootstrap.sh"]
