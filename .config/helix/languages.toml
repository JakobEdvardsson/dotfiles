# ── Language Servers ──────────────────────────────────────────────────────────

[language-server.oxlint]
command = "pnpm"
args = ["exec", "oxlint", "--lsp"]

[language-server.vtsls]
command = "pnpm"
args = ["exec", "vtsls", "--stdio"]

[language-server.vtsls.config.vtsls]
autoUseWorkspaceTsdk = true

[language-server.vtsls.config.vtsls.tsserver]
maxTsServerMemory = 8192

[language-server.vtsls.config.vtsls.experimental.completion]
entriesLimit = 25
enableServerSideFuzzyMatch = false

[language-server.vtsls.config.typescript.suggest]
includeCompletionsForModuleExports = false
includeCompletionsForImportStatements = false

[language-server.vtsls.config.typescript.preferences]
preferGoToSourceDefinition = true

[language-server.vtsls.config.javascript.suggest]
includeCompletionsForModuleExports = false
includeCompletionsForImportStatements = false

[language-server.vtsls.config.javascript.preferences]
preferGoToSourceDefinition = true

[language-server.json-language-server]
command = "pnpm"
args = ["exec", "vscode-json-language-server", "--stdio"]

[language-server.json-language-server.config]
provideFormatter = true

[language-server.yaml-language-server]
command = "pnpm"
args = ["exec", "yaml-language-server", "--stdio"]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validation = true

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "standard"

# ── Languages ─────────────────────────────────────────────────────────────────

[[language]]
name = "typescript"
language-servers = ["vtsls", "oxlint"]
formatter = { command = "pnpm", args = ["exec", "oxfmt", "--stdin-filepath", "dummy.ts"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["vtsls", "oxlint"]
formatter = { command = "pnpm", args = ["exec", "oxfmt", "--stdin-filepath", "dummy.tsx"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = ["vtsls", "oxlint"]
formatter = { command = "pnpm", args = ["exec", "oxfmt", "--stdin-filepath", "dummy.js"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["vtsls", "oxlint"]
formatter = { command = "pnpm", args = ["exec", "oxfmt", "--stdin-filepath", "dummy.jsx"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["json-language-server"]
auto-format = true

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
auto-format = true

[[language]]
name = "python"
language-servers = ["basedpyright"]
formatter = { command = "ruff", args = ["format", "--quiet", "-"] }
auto-format = true
