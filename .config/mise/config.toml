[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
azure-cli = { version = "latest", dependency_prereleases = "allow", with = ["pip"] }
codex = "latest"
gcloud = { version = "latest", postinstall = "gcloud components install gke-gcloud-auth-plugin --quiet" }
gh = "latest"
go = "latest"
go-jsonnet = "0.20.0"
jb = "0.6.0" # jsonnet-bundler; matches neo4j-cloud's pinned version
kubectl = "1.34"
kustomize = "latest"
node = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pnpm = "latest"
python = ["latest", "3.10"]

[settings.upgrade]
auto_prune = false
