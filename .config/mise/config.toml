[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
azure-cli = { version = "latest", dependency_prereleases = "allow", with = ["pip"] }
codex = "latest"
gcloud = "latest"
gh = "latest"
go = "latest"
node = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pnpm = "latest"
python = "latest"

[settings.upgrade]
auto_prune = false
