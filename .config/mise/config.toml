[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
azure-cli = { version = "latest", dependency_prereleases = "allow", with = ["pip"] }
codex = { version = "latest", minimum_release_age = "0s", lazy = true, auto_update = "4h" }
gcloud = { version = "latest", postinstall = "gcloud components install gke-gcloud-auth-plugin --quiet" }
go = "latest"
go-jsonnet = "0.20.0"
jb = "0.6.0" # jsonnet-bundler; matches neo4j-cloud's pinned version
kubectl = "1.34"
kustomize = "latest"
pnpm = "latest"
python = ["latest", "3.10"]

[settings.upgrade]
